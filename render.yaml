# Render blueprint for the Razor skill registry.
# Deploy: push this repo to GitHub, then on render.com -> New -> Blueprint,
# point it at the repo. Render reads this file and provisions both services.
#
# The web service reads DATABASE_URL (wired automatically from the db below),
# so published skills persist across restarts/redeploys on the free tier.
# Set PUBLISH_TOKEN in the dashboard if you want publishing to require a token.
services:
  - type: web
    name: razor-registry
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run serve
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: razor-registry-db
          property: connectionString
      - key: PUBLISH_TOKEN
        sync: false   # set this yourself in the dashboard (optional)

databases:
  - name: razor-registry-db
    plan: free
